name: web-calculator

on:
  push:
    branches:
      - main
      - 'feature/**'

jobs:
  build:
    # Run only for pushes to feature/dockerfile* branches
    if: ${{ github.event_name == 'push' && startsWith(github.ref_name, 'feature/dockerfile') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t calculator:latest .

      - name: Run the Docker container
        run: docker run -d --name web_calculator -p 8080:8080 calculator:latest

      - name: Container List
        run: docker ps -a

      - name: Check application health
        run: |
          set -e
          echo "Waiting for the application to start..."
          sleep 5

          STATUS_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080 || true)

          echo "Application responded with HTTP status code: $STATUS_CODE"

          if [ "$STATUS_CODE" -eq 200 ]; then
            echo "Success! The calculator application is up and running."
          else
            echo "Error: Application health check failed! Container logs:"
            docker logs web_calculator
            exit 1
          fi

      - name: Cleanup
        if: always()
        run: docker rm -f web_calculator || true
